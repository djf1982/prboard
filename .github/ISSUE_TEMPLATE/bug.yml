name: Bug
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste your token.** Remove private repository names from configs and screenshots."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: The view config (YAML), if it matters
      render: yaml
  - type: input
    id: browser
    attributes:
      label: Browser and version
