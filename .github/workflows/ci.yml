name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Schema is up to date
        run: npm run schema && git diff --exit-code public/prboard.schema.json
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
