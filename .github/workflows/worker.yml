name: Deploy token exchange (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test the Worker
        run: npx vitest run tests/worker.test.ts
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret (environment 'cloudflare'). See README › Deploy."
            exit 1
          fi
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # Pinned: wrangler is a deploy-time tool only, not a project dependency.
        run: npx --yes wrangler@4.164.0 deploy
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS https://prboard-auth.17things.co.uk/token -H 'Origin: https://djf1982.github.io')
          test "$code" = "204" || { echo "::error::Preflight returned $code"; exit 1; }
